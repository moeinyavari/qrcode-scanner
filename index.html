<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اسکن QR دسته چک</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QR Decoder -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>

        body {
            font-family: Tahoma, Arial, sans-serif;
        }

        #video {
            transform: scaleX(1);
        }

        .scan-line {
            position: absolute;
            left: 5%;
            right: 5%;
            height: 2px;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: scanLine 2s linear infinite;
        }

        @keyframes scanLine {

            0% {
                top: 10%;
            }

            50% {
                top: 90%;
            }

            100% {
                top: 10%;
            }

        }

        .success-animation {
            animation: success 0.4s ease;
        }

        @keyframes success {

            0% {
                transform: scale(.95);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }

        }

    </style>

</head>

<body class="bg-slate-100 min-h-screen">

<div class="max-w-5xl mx-auto p-5">

    <!-- Header -->

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-5">

        <div class="flex items-center justify-between">

            <div>

                <h1 class="text-xl font-bold text-slate-800">
                    اسکن QR دسته‌چک
                </h1>

                <p class="text-sm text-slate-500 mt-1">
                    دسته‌چک را مقابل دوربین قرار دهید
                </p>

            </div>

            <div
                id="status"
                class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 text-sm">

                آماده

            </div>

        </div>

    </div>


    <!-- Camera -->

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-5">

        <div
            class="relative overflow-hidden rounded-2xl bg-black aspect-video">

            <video
                id="video"
                autoplay
                muted
                playsinline
                class="w-full h-full object-cover">
            </video>


            <!-- Scan Overlay -->

            <div class="absolute inset-0 pointer-events-none">

                <div
                    class="absolute inset-[8%] border-2 border-white/60 rounded-xl">

                </div>

                <div
                    class="scan-line">
                </div>

            </div>


            <!-- Camera loading -->

            <div
                id="cameraLoading"
                class="absolute inset-0 flex items-center justify-center bg-black/70 text-white">

                دوربین خاموش است

            </div>

        </div>


        <!-- Zoom -->

        <div
            id="zoomContainer"
            class="hidden mt-4">

            <div class="flex items-center gap-3">

                <span class="text-sm text-slate-600">
                    بزرگنمایی
                </span>

                <input
                    id="zoomSlider"
                    type="range"
                    min="1"
                    max="3"
                    step="0.1"
                    value="1"
                    class="flex-1">

                <span
                    id="zoomValue"
                    class="text-sm text-slate-600 w-12 text-center">

                    1x

                </span>

            </div>

        </div>


        <!-- Buttons -->

        <div class="flex gap-3 mt-5">

            <button
                id="startBtn"
                onclick="startCamera()"
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium">

                📷 شروع اسکن

            </button>


            <button
                id="stopBtn"
                onclick="stopCamera()"
                disabled
                class="flex-1 bg-red-500 hover:bg-red-600 disabled:bg-slate-200 disabled:text-slate-400 text-white py-3 rounded-xl font-medium">

                ⏹ توقف

            </button>

        </div>

    </div>


    <!-- Last QR -->

    <div
        id="lastResult"
        class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl p-4 mb-5">

        <div class="text-sm text-emerald-600 font-semibold">
            QR شناسایی شد
        </div>

        <div
            id="lastQr"
            class="font-mono text-slate-800 mt-2 break-all">
        </div>

    </div>


    <!-- Results -->

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

        <div class="p-5 border-b flex items-center justify-between">

            <div>

                <h2 class="font-bold text-slate-800">
                    QR های اسکن شده
                </h2>

                <p class="text-sm text-slate-500 mt-1">
                    تعداد اسکن شده:
                    <span id="count">0</span>
                </p>

            </div>


            <button
                onclick="clearResults()"
                class="text-red-500 text-sm">

                پاک کردن

            </button>

        </div>


        <div class="overflow-x-auto">

            <table class="w-full">

                <thead class="bg-slate-50">

                <tr>

                    <th class="text-right px-5 py-3 text-sm">
                        QR Code
                    </th>

                    <th class="text-right px-5 py-3 text-sm">
                        زمان
                    </th>

                </tr>

                </thead>


                <tbody id="results">

                <tr id="empty">

                    <td
                        colspan="2"
                        class="text-center py-10 text-slate-400">

                        هنوز QR اسکن نشده است

                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <div class="p-5 border-t">

            <button
                id="exportBtn"
                onclick="exportExcel()"
                disabled
                class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 text-white py-3 rounded-xl font-medium">

                📊 خروجی Excel

            </button>

        </div>

    </div>

</div>


<!-- Hidden Canvas -->

<canvas
    id="canvas"
    class="hidden">
</canvas>


<script>

let video = document.getElementById("video");

let canvas = document.getElementById("canvas");

let ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

let stream = null;

let scanning = false;

let scanTimer = null;

let results = [];

let lastQR = "";

let lastQRTime = 0;

let currentTrack = null;


/*
|--------------------------------------------------------------------------
| Start Camera
|--------------------------------------------------------------------------
*/

async function startCamera() {

    try {

        updateStatus(
            "در حال باز کردن دوربین...",
            "bg-blue-100 text-blue-700"
        );


        stream = await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30,
                    max: 30
                }

            },

            audio: false

        });


        video.srcObject = stream;


        await video.play();


        currentTrack = stream.getVideoTracks()[0];


        console.log(
            "Camera settings:",
            currentTrack.getSettings()
        );


        /*
        |--------------------------------------------------------------------------
        | Zoom Support
        |--------------------------------------------------------------------------
        */

        const capabilities =
            currentTrack.getCapabilities();


        if (capabilities.zoom) {

            const minZoom =
                capabilities.zoom.min || 1;

            const maxZoom =
                Math.min(
                    capabilities.zoom.max || 3,
                    3
                );


            const slider =
                document.getElementById("zoomSlider");


            slider.min = minZoom;

            slider.max = maxZoom;

            slider.step =
                capabilities.zoom.step || 0.1;

            slider.value = minZoom;


            document
                .getElementById("zoomContainer")
                .classList.remove("hidden");


            slider.oninput =
                async function() {

                    const zoom =
                        Number(this.value);


                    document
                        .getElementById("zoomValue")
                        .textContent =
                        zoom.toFixed(1) + "x";


                    try {

                        await currentTrack.applyConstraints({

                            advanced: [
                                {
                                    zoom: zoom
                                }
                            ]

                        });

                    }
                    catch (e) {

                        console.log(
                            "Zoom not supported",
                            e
                        );

                    }

                };

        }


        document
            .getElementById("cameraLoading")
            .classList.add("hidden");


        document
            .getElementById("startBtn")
            .disabled = true;


        document
            .getElementById("stopBtn")
            .disabled = false;


        scanning = true;


        updateStatus(
            "آماده اسکن QR",
            "bg-emerald-100 text-emerald-700"
        );


        startScanning();

    }
    catch (error) {

        console.error(error);


        updateStatus(
            "خطا در دوربین",
            "bg-red-100 text-red-700"
        );


        alert(
            "دسترسی به دوربین امکان‌پذیر نیست.\n\n" +
            "مطمئن شوید که دسترسی Camera را به مرورگر داده‌اید."
        );

    }

}


/*
|--------------------------------------------------------------------------
| Scan
|--------------------------------------------------------------------------
*/

function startScanning() {

    if (!scanning)
        return;


    scanFrame();

}


/*
|--------------------------------------------------------------------------
| Read Camera Frame
|--------------------------------------------------------------------------
*/

function scanFrame() {

    if (!scanning)
        return;


    if (
        video.readyState !==
        video.HAVE_ENOUGH_DATA
    ) {

        scanTimer =
            setTimeout(scanFrame, 100);

        return;

    }


    /*
    |--------------------------------------------------------------------------
    | Camera Resolution
    |--------------------------------------------------------------------------
    */

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;


    if (!width || !height) {

        scanTimer =
            setTimeout(scanFrame, 100);

        return;

    }


    canvas.width = width;

    canvas.height = height;


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    /*
    |--------------------------------------------------------------------------
    | First: Scan Full Image
    |--------------------------------------------------------------------------
    */

    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const code =
        jsQR(
            imageData.data,
            width,
            height,
            {
                inversionAttempts: "attemptBoth"
            }
        );


    if (code) {

        handleQR(code.data);

        scanTimer =
            setTimeout(scanFrame, 150);

        return;

    }


    /*
    |--------------------------------------------------------------------------
    | Second: Scan Cropped Regions
    |
    | برای QR کوچک بسیار مهم است.
    |--------------------------------------------------------------------------
    */

    const regions = [

        // مرکز
        {
            x: 0.15,
            y: 0.15,
            w: 0.70,
            h: 0.70
        },

        // بالا چپ
        {
            x: 0,
            y: 0,
            w: 0.60,
            h: 0.60
        },

        // بالا راست
        {
            x: 0.40,
            y: 0,
            w: 0.60,
            h: 0.60
        },

        // پایین چپ
        {
            x: 0,
            y: 0.40,
            w: 0.60,
            h: 0.60
        },

        // پایین راست
        {
            x: 0.40,
            y: 0.40,
            w: 0.60,
            h: 0.60
        }

    ];


    for (const region of regions) {

        const x =
            Math.floor(
                width * region.x
            );

        const y =
            Math.floor(
                height * region.y
            );

        const w =
            Math.floor(
                width * region.w
            );

        const h =
            Math.floor(
                height * region.h
            );


        /*
        |--------------------------------------------------------------------------
        | Crop
        |--------------------------------------------------------------------------
        */

        const cropCanvas =
            document.createElement("canvas");


        /*
        | دو برابر کردن تصویر crop
        | برای QR های کوچک
        */

        const scale = 2;


        cropCanvas.width =
            w * scale;

        cropCanvas.height =
            h * scale;


        const cropCtx =
            cropCanvas.getContext("2d", {
                willReadFrequently: true
            });


        cropCtx.imageSmoothingEnabled = false;


        cropCtx.drawImage(

            video,

            x,
            y,
            w,
            h,

            0,
            0,
            w * scale,
            h * scale

        );


        const cropImage =
            cropCtx.getImageData(
                0,
                0,
                w * scale,
                h * scale
            );


        const result =
            jsQR(

                cropImage.data,

                w * scale,

                h * scale,

                {
                    inversionAttempts:
                        "attemptBoth"
                }

            );


        if (result) {

            handleQR(result.data);

            break;

        }

    }


    /*
    |--------------------------------------------------------------------------
    | حدود 8 فریم در ثانیه
    |--------------------------------------------------------------------------
    */

    scanTimer =
        setTimeout(
            scanFrame,
            120
        );

}


/*
|--------------------------------------------------------------------------
| QR Found
|--------------------------------------------------------------------------
*/

function handleQR(value) {

    const now =
        Date.now();


    /*
    | جلوگیری از چند بار خواندن
    | همان QR
    */

    if (
        value === lastQR &&
        now - lastQRTime < 2500
    ) {

        return;

    }


    lastQR = value;

    lastQRTime = now;


    /*
    | اگر قبلاً ثبت شده
    */

    const exists =
        results.some(
            x => x.qrCode === value
        );


    if (exists) {

        showLastQR(
            value,
            true
        );

        return;

    }


    const item = {

        qrCode: value,

        time: new Date()

    };


    results.push(item);


    addResult(item);


    showLastQR(
        value,
        false
    );


    updateStatus(
        "QR شناسایی شد ✓",
        "bg-emerald-100 text-emerald-700"
    );


    setTimeout(() => {

        if (scanning) {

            updateStatus(
                "آماده اسکن QR بعدی",
                "bg-blue-100 text-blue-700"
            );

        }

    }, 1200);

}


/*
|--------------------------------------------------------------------------
| Add Result
|--------------------------------------------------------------------------
*/

function addResult(item) {

    const empty =
        document.getElementById("empty");


    if (empty)
        empty.remove();


    const tr =
        document.createElement("tr");


    tr.className =
        "border-b border-slate-100";


    tr.innerHTML = `

        <td class="px-5 py-4">

            <div class="font-mono text-sm break-all">

                ${escapeHtml(item.qrCode)}

            </div>

        </td>

        <td class="px-5 py-4 text-sm text-slate-500">

            ${formatDate(item.time)}

        </td>

    `;


    document
        .getElementById("results")
        .prepend(tr);


    document
        .getElementById("count")
        .textContent =
        results.length;


    document
        .getElementById("exportBtn")
        .disabled = false;

}


/*
|--------------------------------------------------------------------------
| Last QR
|--------------------------------------------------------------------------
*/

function showLastQR(
    value,
    duplicate
) {

    const box =
        document.getElementById(
            "lastResult"
        );


    const text =
        document.getElementById(
            "lastQr"
        );


    box.classList.remove(
        "hidden"
    );


    text.textContent =
        value;


    if (duplicate) {

        box.className =
            "bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-5";

    }
    else {

        box.className =
            "bg-emerald-50 border border-emerald-200 rounded-2xl p-4 mb-5 success-animation";

    }

}


/*
|--------------------------------------------------------------------------
| Stop Camera
|--------------------------------------------------------------------------
*/

function stopCamera() {

    scanning = false;


    if (scanTimer) {

        clearTimeout(scanTimer);

        scanTimer = null;

    }


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream = null;

    }


    video.srcObject = null;

    currentTrack = null;


    document
        .getElementById("startBtn")
        .disabled = false;


    document
        .getElementById("stopBtn")
        .disabled = true;


    document
        .getElementById("cameraLoading")
        .classList.remove("hidden");


    document
        .getElementById("zoomContainer")
        .classList.add("hidden");


    updateStatus(
        "اسکن متوقف شد",
        "bg-slate-100 text-slate-600"
    );

}


/*
|--------------------------------------------------------------------------
| Clear
|--------------------------------------------------------------------------
*/

function clearResults() {

    results = [];

    lastQR = "";

    lastQRTime = 0;


    document
        .getElementById("results")
        .innerHTML = `

            <tr id="empty">

                <td
                    colspan="2"
                    class="text-center py-10 text-slate-400">

                    هنوز QR اسکن نشده است

                </td>

            </tr>

        `;


    document
        .getElementById("count")
        .textContent = "0";


    document
        .getElementById("exportBtn")
        .disabled = true;

}


/*
|--------------------------------------------------------------------------
| Excel
|--------------------------------------------------------------------------
*/

function exportExcel() {

    if (!results.length)
        return;


    const data =
        results.map((item, index) => ({

            "ردیف":
                index + 1,

            "QR Code":
                item.qrCode,

            "زمان اسکن":
                formatDate(item.time)

        }));


    const worksheet =
        XLSX.utils.json_to_sheet(data);


    worksheet["!cols"] = [

        {
            wch: 8
        },

        {
            wch: 70
        },

        {
            wch: 25
        }

    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "QR دسته چک"
    );


    XLSX.writeFile(
        workbook,
        "Cheque_QR.xlsx"
    );

}


/*
|--------------------------------------------------------------------------
| Status
|--------------------------------------------------------------------------
*/

function updateStatus(
    text,
    classes
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        text;


    status.className =
        "px-4 py-2 rounded-full text-sm " +
        classes;

}


/*
|--------------------------------------------------------------------------
| Date
|--------------------------------------------------------------------------
*/

function formatDate(date) {

    return date.toLocaleString(
        "fa-IR",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );

}


/*
|--------------------------------------------------------------------------
| Escape HTML
|--------------------------------------------------------------------------
*/

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/*
|--------------------------------------------------------------------------
| Page Close
|--------------------------------------------------------------------------
*/

window.addEventListener(
    "beforeunload",
    () => {

        stopCamera();

    }
);

</script>

</body>
</html>
