<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اسکن QR دسته چک</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f8fafc;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            border-radius: 16px;
            object-fit: cover;
        }

        #reader__dashboard_section_csr button {
            border: none !important;
            background: #0f172a !important;
            color: white !important;
            padding: 10px 18px !important;
            border-radius: 10px !important;
            cursor: pointer;
        }

        #reader__dashboard_section_swaplink {
            color: #2563eb !important;
        }

        .scan-success {
            animation: success 0.5s ease;
        }

        @keyframes success {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="min-h-screen">

    <div class="max-w-5xl mx-auto px-4 py-8">

        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">

            <div class="flex items-center justify-between gap-4">

                <div>
                    <h1 class="text-2xl font-bold text-slate-800">
                        اسکن QR دسته چک
                    </h1>

                    <p class="text-sm text-slate-500 mt-2">
                        QR دسته‌چک را مقابل دوربین قرار دهید
                    </p>
                </div>

                <div
                    id="statusBadge"
                    class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 text-sm font-medium">
                    آماده اسکن
                </div>

            </div>

        </div>


        <!-- Scanner -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6">

            <div
                id="reader"
                class="overflow-hidden rounded-2xl">
            </div>

            <div class="flex flex-wrap gap-3 mt-5">

                <button
                    id="startBtn"
                    onclick="startScanner()"
                    class="flex-1 min-w-[180px] bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-5 rounded-xl transition">

                    📷 شروع اسکن

                </button>

                <button
                    id="stopBtn"
                    onclick="stopScanner()"
                    disabled
                    class="flex-1 min-w-[180px] bg-red-500 hover:bg-red-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-medium py-3 px-5 rounded-xl transition">

                    ⏹ توقف اسکن

                </button>

            </div>

        </div>


        <!-- Last Result -->
        <div
            id="lastResult"
            class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl p-5 mb-6">

            <div class="flex items-center gap-3">

                <div
                    class="w-11 h-11 rounded-full bg-emerald-100 flex items-center justify-center text-xl">
                    ✓
                </div>

                <div class="flex-1">

                    <div class="text-sm text-emerald-600 font-medium">
                        QR با موفقیت خوانده شد
                    </div>

                    <div
                        id="lastQr"
                        class="mt-1 font-mono text-slate-800 break-all">
                    </div>

                </div>

            </div>

        </div>


        <!-- Results -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

            <div class="p-5 border-b border-slate-200 flex items-center justify-between">

                <div>
                    <h2 class="font-bold text-lg text-slate-800">
                        QR های اسکن شده
                    </h2>

                    <p class="text-sm text-slate-500 mt-1">
                        اطلاعات QR های خوانده شده در این بخش نمایش داده می‌شود
                    </p>
                </div>

                <button
                    id="clearBtn"
                    onclick="clearResults()"
                    class="text-sm text-red-500 hover:text-red-700">

                    پاک کردن

                </button>

            </div>


            <div class="overflow-x-auto">

                <table class="w-full text-sm">

                    <thead class="bg-slate-50">

                        <tr>

                            <th class="text-right px-5 py-4 font-semibold text-slate-600">
                                اطلاعات QR
                            </th>

                            <th class="text-right px-5 py-4 font-semibold text-slate-600">
                                زمان اسکن
                            </th>

                        </tr>

                    </thead>

                    <tbody id="resultsBody">

                        <tr id="emptyRow">

                            <td
                                colspan="2"
                                class="text-center py-12 text-slate-400">

                                هنوز QR ای اسکن نشده است

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- Export -->
            <div class="p-5 border-t border-slate-200">

                <button
                    id="exportBtn"
                    onclick="exportExcel()"
                    disabled
                    class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-medium py-3 px-5 rounded-xl transition">

                    📊 خروجی Excel

                </button>

            </div>

        </div>

    </div>


<script>

    let html5QrCode = null;

    let isScanning = false;

    let scanResults = [];

    // جلوگیری از ثبت پشت سرهم یک QR
    let lastScannedText = null;

    let lastScanTime = 0;

    // مدت زمانی که یک QR دوباره قابل ثبت نیست
    const duplicateDelay = 2000;


    // -----------------------------------------
    // Start Scanner
    // -----------------------------------------

    async function startScanner() {

        if (isScanning)
            return;

        try {

            html5QrCode = new Html5Qrcode("reader");

            updateStatus(
                "در حال اسکن...",
                "bg-blue-100 text-blue-700"
            );

            document.getElementById("startBtn").disabled = true;

            document.getElementById("stopBtn").disabled = false;


            /*
             * qrbox باعث می‌شود محدوده‌ای برای QR داشته باشیم.
             *
             * برای QR کوچک دسته‌چک این مقدار را نسبتاً بزرگ
             * قرار داده‌ایم تا پیدا کردن QR راحت‌تر باشد.
             */

            const config = {

                fps: 15,

                qrbox: function(viewfinderWidth, viewfinderHeight) {

                    const size = Math.min(
                        viewfinderWidth * 0.75,
                        viewfinderHeight * 0.75
                    );

                    return {
                        width: size,
                        height: size
                    };

                },

                aspectRatio: 1.0,

                disableFlip: false

            };


            await html5QrCode.start(

                {
                    facingMode: "environment"
                },

                config,

                onScanSuccess,

                onScanFailure

            );

            isScanning = true;

        }
        catch (error) {

            console.error(error);

            updateStatus(
                "خطا در دسترسی به دوربین",
                "bg-red-100 text-red-700"
            );

            document.getElementById("startBtn").disabled = false;

            document.getElementById("stopBtn").disabled = true;

            alert(
                "امکان دسترسی به دوربین وجود ندارد.\n\n" +
                "اگر با فایل HTML اجرا می‌کنید، بهتر است آن را از طریق localhost یا HTTPS اجرا کنید."
            );
        }

    }


    // -----------------------------------------
    // QR Success
    // -----------------------------------------

    function onScanSuccess(decodedText, decodedResult) {

        const now = Date.now();


        /*
         * جلوگیری از ثبت چندباره همان QR
         * چون وقتی QR جلوی دوربین باشد ممکن است
         * چندین بار در ثانیه خوانده شود.
         */

        if (
            decodedText === lastScannedText &&
            now - lastScanTime < duplicateDelay
        ) {

            return;

        }


        lastScannedText = decodedText;

        lastScanTime = now;


        // بررسی اینکه قبلاً ثبت نشده باشد
        const alreadyExists = scanResults.some(
            item => item.qrCode === decodedText
        );


        if (alreadyExists) {

            showLastResult(
                decodedText,
                true
            );

            return;

        }


        // ثبت اطلاعات
        const result = {

            qrCode: decodedText,

            scanTime: new Date()

        };


        scanResults.push(result);


        addResultToTable(result);


        showLastResult(
            decodedText,
            false
        );


        updateStatus(
            "QR با موفقیت اسکن شد",
            "bg-emerald-100 text-emerald-700"
        );


        // بعد از مدت کوتاه دوباره وضعیت را آماده اسکن می‌کنیم
        setTimeout(() => {

            if (isScanning) {

                updateStatus(
                    "آماده اسکن QR بعدی",
                    "bg-blue-100 text-blue-700"
                );

            }

        }, 1000);

    }


    // -----------------------------------------
    // QR Failure
    // -----------------------------------------

    function onScanFailure(error) {

        // اینجا چیزی نمایش نمی‌دهیم.
        // چون در زمان اسکن، خطای پیدا نشدن QR
        // کاملاً طبیعی است.

    }


    // -----------------------------------------
    // Stop Scanner
    // -----------------------------------------

    async function stopScanner() {

        if (!html5QrCode)
            return;


        try {

            await html5QrCode.stop();

            await html5QrCode.clear();

        }
        catch (error) {

            console.error(error);

        }


        html5QrCode = null;

        isScanning = false;


        document.getElementById("startBtn").disabled = false;

        document.getElementById("stopBtn").disabled = true;


        updateStatus(
            "اسکن متوقف شد",
            "bg-slate-100 text-slate-600"
        );

    }


    // -----------------------------------------
    // Add Result To Table
    // -----------------------------------------

    function addResultToTable(result) {

        const emptyRow =
            document.getElementById("emptyRow");

        if (emptyRow) {

            emptyRow.remove();

        }


        const tbody =
            document.getElementById("resultsBody");


        const tr =
            document.createElement("tr");


        tr.className =
            "border-b border-slate-100 hover:bg-slate-50";


        tr.innerHTML = `

            <td class="px-5 py-4">

                <div
                    class="font-mono text-slate-700 break-all">
                    ${escapeHtml(result.qrCode)}
                </div>

            </td>

            <td class="px-5 py-4 text-slate-500 whitespace-nowrap">

                ${formatDate(result.scanTime)}

            </td>

        `;


        tbody.prepend(tr);


        document.getElementById("exportBtn").disabled = false;

    }


    // -----------------------------------------
    // Last Result
    // -----------------------------------------

    function showLastResult(text, duplicate) {

        const container =
            document.getElementById("lastResult");

        const value =
            document.getElementById("lastQr");


        container.classList.remove("hidden");

        container.classList.remove("scan-success");

        void container.offsetWidth;

        container.classList.add("scan-success");


        value.textContent = text;


        if (duplicate) {

            container.classList.remove(
                "bg-emerald-50",
                "border-emerald-200"
            );

            container.classList.add(
                "bg-amber-50",
                "border-amber-200"
            );

        }
        else {

            container.classList.remove(
                "bg-amber-50",
                "border-amber-200"
            );

            container.classList.add(
                "bg-emerald-50",
                "border-emerald-200"
            );

        }

    }


    // -----------------------------------------
    // Status
    // -----------------------------------------

    function updateStatus(text, classes) {

        const badge =
            document.getElementById("statusBadge");


        badge.textContent = text;

        badge.className =
            "px-4 py-2 rounded-full text-sm font-medium " +
            classes;

    }


    // -----------------------------------------
    // Clear Results
    // -----------------------------------------

    function clearResults() {

        if (scanResults.length === 0)
            return;


        if (!confirm("آیا از پاک کردن تمام اطلاعات اطمینان دارید؟"))
            return;


        scanResults = [];

        lastScannedText = null;

        lastScanTime = 0;


        document.getElementById("resultsBody").innerHTML = `

            <tr id="emptyRow">

                <td
                    colspan="2"
                    class="text-center py-12 text-slate-400">

                    هنوز QR ای اسکن نشده است

                </td>

            </tr>

        `;


        document.getElementById("exportBtn").disabled = true;

    }


    // -----------------------------------------
    // Export Excel
    // -----------------------------------------

    function exportExcel() {

        if (scanResults.length === 0) {

            alert("هیچ اطلاعاتی برای خروجی وجود ندارد.");

            return;

        }


        const excelData =
            scanResults.map(item => ({

                "QR Code": item.qrCode,

                "زمان اسکن": formatDate(item.scanTime)

            }));


        const worksheet =
            XLSX.utils.json_to_sheet(excelData);


        // تنظیم عرض ستون‌ها
        worksheet["!cols"] = [

            {
                wch: 60
            },

            {
                wch: 25
            }

        ];


        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "QR Codes"
        );


        const fileName =
            "Cheque_QR_" +
            getFileDate() +
            ".xlsx";


        XLSX.writeFile(
            workbook,
            fileName
        );

    }


    // -----------------------------------------
    // Date
    // -----------------------------------------

    function formatDate(date) {

        return date.toLocaleString(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    }


    function getFileDate() {

        const d = new Date();

        return (

            d.getFullYear() +

            String(d.getMonth() + 1).padStart(2, "0") +

            String(d.getDate()).padStart(2, "0") +

            "_" +

            String(d.getHours()).padStart(2, "0") +

            String(d.getMinutes()).padStart(2, "0")

        );

    }


    // -----------------------------------------
    // Security
    // -----------------------------------------

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
