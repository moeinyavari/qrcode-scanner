<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>اسکن QR دسته چک</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jsQR fallback -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            background: #f1f5f9;
        }


        /* ---------------------------------------------
           Camera
        --------------------------------------------- */

        .camera-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 20px;
            background: #020617;
        }


        #video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(1);
        }


        /* ---------------------------------------------
           Scanner Overlay
        --------------------------------------------- */

        .scanner-overlay {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }


        .scanner-box {
            position: absolute;

            width: 70%;
            aspect-ratio: 1 / 1;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 2px solid rgba(255,255,255,.9);

            border-radius: 18px;

            box-shadow:
                0 0 0 9999px rgba(0,0,0,.28);
        }


        .corner {
            position: absolute;

            width: 42px;
            height: 42px;

            border-color: #22c55e;
        }


        .corner.tl {
            left: -2px;
            top: -2px;

            border-left: 5px solid;
            border-top: 5px solid;

            border-radius: 8px 0 0 0;
        }


        .corner.tr {
            right: -2px;
            top: -2px;

            border-right: 5px solid;
            border-top: 5px solid;

            border-radius: 0 8px 0 0;
        }


        .corner.bl {
            left: -2px;
            bottom: -2px;

            border-left: 5px solid;
            border-bottom: 5px solid;

            border-radius: 0 0 0 8px;
        }


        .corner.br {
            right: -2px;
            bottom: -2px;

            border-right: 5px solid;
            border-bottom: 5px solid;

            border-radius: 0 0 8px 0;
        }


        /* ---------------------------------------------
           Scan line
        --------------------------------------------- */

        .scan-line {
            position: absolute;

            left: 5%;
            right: 5%;

            height: 2px;

            background: #22c55e;

            box-shadow:
                0 0 10px #22c55e,
                0 0 20px #22c55e;

            animation:
                scanLine 2s ease-in-out infinite;
        }


        @keyframes scanLine {

            0% {
                top: 7%;
            }

            50% {
                top: 93%;
            }

            100% {
                top: 7%;
            }

        }


        /* ---------------------------------------------
           Success
        --------------------------------------------- */

        .success-animation {
            animation:
                successAnimation .4s ease;
        }


        @keyframes successAnimation {

            0% {
                transform: scale(.96);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }

        }


        /* ---------------------------------------------
           Mobile
        --------------------------------------------- */

        @media(max-width:640px) {

            .scanner-box {
                width: 76%;
            }

            .corner {
                width: 36px;
                height: 36px;
            }

        }

    </style>

</head>


<body>

<div class="max-w-4xl mx-auto px-4 py-6">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div
        class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 mb-5">

        <div class="flex items-center justify-between gap-4">

            <div>

                <h1
                    class="text-xl sm:text-2xl font-bold text-slate-800">

                    اسکن QR دسته چک

                </h1>

                <p
                    class="text-sm text-slate-500 mt-2 leading-7">

                    QR دسته‌چک را داخل کادر قرار دهید

                </p>

            </div>


            <div
                id="status"
                class="shrink-0 px-4 py-2 rounded-full bg-slate-100 text-slate-600 text-xs sm:text-sm">

                آماده

            </div>

        </div>

    </div>



    <!-- =====================================================
         CAMERA
    ====================================================== -->

    <div
        class="bg-white rounded-3xl border border-slate-200 shadow-sm p-4 mb-5">


        <div class="camera-wrapper">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>


            <div
                id="cameraOff"
                class="absolute inset-0 flex items-center justify-center bg-slate-950 text-white z-20">

                <div class="text-center">

                    <div class="text-4xl mb-3">
                        📷
                    </div>

                    <div class="text-sm">
                        دوربین خاموش است
                    </div>

                </div>

            </div>


            <!-- Scanner overlay -->

            <div
                id="scannerOverlay"
                class="scanner-overlay hidden">

                <div class="scanner-box">

                    <div class="corner tl"></div>
                    <div class="corner tr"></div>
                    <div class="corner bl"></div>
                    <div class="corner br"></div>

                    <div class="scan-line"></div>

                </div>

            </div>


            <!-- Processing -->

            <div
                id="processing"
                class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 z-30">

                <div
                    class="bg-black/70 text-white rounded-full px-4 py-2 text-xs">

                    در حال بررسی QR...

                </div>

            </div>

        </div>


        <!-- =================================================
             ZOOM
        ================================================== -->

        <div
            id="zoomContainer"
            class="hidden mt-5 bg-slate-50 rounded-2xl p-4">

            <div
                class="flex items-center gap-3">

                <span
                    class="text-sm text-slate-600 whitespace-nowrap">

                    زوم

                </span>


                <input
                    id="zoomSlider"
                    type="range"
                    min="1"
                    max="3"
                    step="0.1"
                    value="1"
                    class="flex-1">


                <span
                    id="zoomValue"
                    class="text-sm font-medium text-slate-700 w-12 text-center">

                    1x

                </span>

            </div>

        </div>


        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div
            class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5">


            <button
                id="startBtn"
                onclick="startCamera()"
                class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-3.5 rounded-2xl transition">

                📷 شروع اسکن

            </button>


            <button
                id="stopBtn"
                onclick="stopCamera()"
                disabled
                class="bg-red-500 hover:bg-red-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-medium py-3.5 rounded-2xl transition">

                ⏹ توقف اسکن

            </button>

        </div>


        <!-- Hint -->

        <div
            class="mt-4 text-center text-xs text-slate-400 leading-6">

            QR را تا حد امکان نزدیک کنید تا داخل کادر بزرگ و واضح دیده شود.

        </div>

    </div>



    <!-- =====================================================
         LAST RESULT
    ====================================================== -->

    <div
        id="lastResult"
        class="hidden rounded-3xl p-5 mb-5 border">

        <div
            class="flex gap-3 items-start">

            <div
                id="resultIcon"
                class="w-11 h-11 shrink-0 rounded-full flex items-center justify-center text-xl">

                ✓

            </div>


            <div
                class="min-w-0 flex-1">

                <div
                    id="resultTitle"
                    class="font-bold">

                    QR شناسایی شد

                </div>


                <div
                    id="lastQr"
                    class="font-mono text-sm mt-2 break-all text-slate-700">

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         RESULTS
    ====================================================== -->

    <div
        class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">


        <div
            class="p-5 border-b border-slate-200 flex items-center justify-between gap-3">

            <div>

                <h2
                    class="font-bold text-slate-800">

                    QR های اسکن شده

                </h2>


                <p
                    class="text-xs text-slate-500 mt-1">

                    تعداد:
                    <span
                        id="count"
                        class="font-bold text-blue-600">

                        0

                    </span>

                </p>

            </div>


            <button
                onclick="clearResults()"
                class="text-sm text-red-500 hover:text-red-700">

                پاک کردن

            </button>

        </div>


        <div
            class="overflow-x-auto">


            <table
                class="w-full text-sm">


                <thead
                    class="bg-slate-50">

                <tr>

                    <th
                        class="text-right px-5 py-4 text-slate-600">

                        ردیف

                    </th>


                    <th
                        class="text-right px-5 py-4 text-slate-600">

                        QR Code

                    </th>


                    <th
                        class="text-right px-5 py-4 text-slate-600 whitespace-nowrap">

                        زمان

                    </th>

                </tr>

                </thead>


                <tbody id="results">

                <tr id="empty">

                    <td
                        colspan="3"
                        class="text-center py-12 text-slate-400">

                        هنوز QR ای اسکن نشده است

                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <!-- Export -->

        <div
            class="p-5 border-t border-slate-200">

            <button
                id="exportBtn"
                onclick="exportExcel()"
                disabled
                class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-medium py-3.5 rounded-2xl transition">

                📊 دریافت خروجی Excel

            </button>

        </div>

    </div>

</div>



<!-- =========================================================
     HIDDEN CANVASES
========================================================== -->

<canvas
    id="canvas"
    class="hidden">
</canvas>


<canvas
    id="processingCanvas"
    class="hidden">
</canvas>



<script>

/*
|--------------------------------------------------------------------------
| Variables
|--------------------------------------------------------------------------
*/

let video =
    document.getElementById("video");

let canvas =
    document.getElementById("canvas");

let processingCanvas =
    document.getElementById("processingCanvas");

let ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );

let processingCtx =
    processingCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


let stream = null;

let track = null;

let scanning = false;

let scanTimeout = null;

let results = [];

let lastDecodedValue = "";

let lastDecodedTime = 0;


/*
|--------------------------------------------------------------------------
| Barcode Detector
|--------------------------------------------------------------------------
*/

let barcodeDetector = null;


if (
    "BarcodeDetector" in window
) {

    try {

        barcodeDetector =
            new BarcodeDetector({
                formats: [
                    "qr_code"
                ]
            });

        console.log(
            "BarcodeDetector available"
        );

    }
    catch (error) {

        console.log(
            "BarcodeDetector unavailable",
            error
        );

    }

}


/*
|--------------------------------------------------------------------------
| Start Camera
|--------------------------------------------------------------------------
*/

async function startCamera() {

    if (scanning)
        return;


    try {

        updateStatus(
            "در حال باز کردن دوربین...",
            "bg-blue-100 text-blue-700"
        );


        /*
        |--------------------------------------------------------------------------
        | Request high quality camera
        |--------------------------------------------------------------------------
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 2560
                    },

                    height: {
                        ideal: 1440
                    },

                    frameRate: {
                        ideal: 30,
                        max: 30
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        track =
            stream.getVideoTracks()[0];


        const settings =
            track.getSettings();


        console.log(
            "Camera settings:",
            settings
        );


        const capabilities =
            track.getCapabilities
                ? track.getCapabilities()
                : {};


        /*
        |--------------------------------------------------------------------------
        | Autofocus
        |--------------------------------------------------------------------------
        */

        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes("continuous")
        ) {

            try {

                await track.applyConstraints({

                    advanced: [

                        {
                            focusMode: "continuous"
                        }

                    ]

                });

                console.log(
                    "Continuous autofocus enabled"
                );

            }
            catch (e) {

                console.log(
                    "Could not enable autofocus",
                    e
                );

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Zoom
        |--------------------------------------------------------------------------
        */

        setupZoom(
            capabilities
        );


        /*
        |--------------------------------------------------------------------------
        | UI
        |--------------------------------------------------------------------------
        */

        document
            .getElementById("cameraOff")
            .classList.add("hidden");


        document
            .getElementById("scannerOverlay")
            .classList.remove("hidden");


        document
            .getElementById("startBtn")
            .disabled = true;


        document
            .getElementById("stopBtn")
            .disabled = false;


        scanning = true;


        updateStatus(
            "آماده اسکن QR",
            "bg-emerald-100 text-emerald-700"
        );


        /*
        |--------------------------------------------------------------------------
        | Start decoder
        |--------------------------------------------------------------------------
        */

        scanLoop();

    }
    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        updateStatus(
            "خطا در دوربین",
            "bg-red-100 text-red-700"
        );


        alert(
            "دسترسی به دوربین امکان‌پذیر نیست.\n\n" +
            "مطمئن شوید مجوز Camera را به مرورگر داده‌اید."
        );

    }

}


/*
|--------------------------------------------------------------------------
| Zoom
|--------------------------------------------------------------------------
*/

function setupZoom(
    capabilities
) {

    const container =
        document.getElementById(
            "zoomContainer"
        );


    const slider =
        document.getElementById(
            "zoomSlider"
        );


    const value =
        document.getElementById(
            "zoomValue"
        );


    if (
        !capabilities.zoom
    ) {

        container.classList.add(
            "hidden"
        );

        return;

    }


    const min =
        capabilities.zoom.min || 1;

    const max =
        Math.min(
            capabilities.zoom.max || 3,
            4
        );

    const step =
        capabilities.zoom.step || 0.1;


    slider.min = min;

    slider.max = max;

    slider.step = step;

    slider.value = min;


    value.textContent =
        Number(min).toFixed(1) + "x";


    container.classList.remove(
        "hidden"
    );


    slider.oninput =
        async function() {

            const zoom =
                Number(this.value);


            value.textContent =
                zoom.toFixed(1) + "x";


            if (!track)
                return;


            try {

                await track.applyConstraints({

                    advanced: [

                        {
                            zoom: zoom
                        }

                    ]

                });

            }
            catch (error) {

                console.log(
                    "Zoom error:",
                    error
                );

            }

        };

}


/*
|--------------------------------------------------------------------------
| Main Scan Loop
|--------------------------------------------------------------------------
*/

async function scanLoop() {

    if (!scanning)
        return;


    if (
        video.readyState !==
        video.HAVE_ENOUGH_DATA
    ) {

        scheduleScan();

        return;

    }


    try {

        /*
        |--------------------------------------------------------------------------
        | First: BarcodeDetector
        |--------------------------------------------------------------------------
        */

        if (barcodeDetector) {

            const detected =
                await barcodeDetector.detect(
                    video
                );


            if (
                detected &&
                detected.length
            ) {

                for (
                    const item of detected
                ) {

                    if (
                        item.rawValue
                    ) {

                        handleQR(
                            item.rawValue
                        );

                        scheduleScan();

                        return;

                    }

                }

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Second: jsQR
        |--------------------------------------------------------------------------
        */

        const result =
            scanWithJsQR();


        if (result) {

            handleQR(
                result
            );

        }

    }
    catch (error) {

        console.log(
            "Scan error:",
            error
        );

    }


    scheduleScan();

}


/*
|--------------------------------------------------------------------------
| Schedule
|--------------------------------------------------------------------------
*/

function scheduleScan() {

    if (!scanning)
        return;


    scanTimeout =
        setTimeout(
            scanLoop,
            100
        );

}


/*
|--------------------------------------------------------------------------
| jsQR Multi Processing
|--------------------------------------------------------------------------
*/

function scanWithJsQR() {

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;


    if (
        !width ||
        !height
    ) {

        return null;

    }


    /*
    |--------------------------------------------------------------------------
    | We don't need full frame at first.
    |
    | QR is expected to be inside scanner box.
    |--------------------------------------------------------------------------
    */


    const size =
        Math.floor(
            Math.min(
                width,
                height
            ) * 0.78
        );


    const x =
        Math.floor(
            (width - size) / 2
        );


    const y =
        Math.floor(
            (height - size) / 2
        );


    /*
    |--------------------------------------------------------------------------
    | Try original crop
    |--------------------------------------------------------------------------
    */

    let result =
        decodeCrop(
            x,
            y,
            size,
            size,
            1
        );


    if (result)
        return result;


    /*
    |--------------------------------------------------------------------------
    | Upscale 2x
    |--------------------------------------------------------------------------
    */

    result =
        decodeCrop(
            x,
            y,
            size,
            size,
            2
        );


    if (result)
        return result;


    /*
    |--------------------------------------------------------------------------
    | Upscale 3x
    |--------------------------------------------------------------------------
    */

    result =
        decodeCrop(
            x,
            y,
            size,
            size,
            3
        );


    if (result)
        return result;


    /*
    |--------------------------------------------------------------------------
    | Upscale 4x
    |--------------------------------------------------------------------------
    */

    result =
        decodeCrop(
            x,
            y,
            size,
            size,
            4
        );


    if (result)
        return result;


    return null;

}


/*
|--------------------------------------------------------------------------
| Decode Crop
|--------------------------------------------------------------------------
*/

function decodeCrop(
    x,
    y,
    width,
    height,
    scale
) {

    const outputWidth =
        Math.floor(
            width * scale
        );

    const outputHeight =
        Math.floor(
            height * scale
        );


    processingCanvas.width =
        outputWidth;

    processingCanvas.height =
        outputHeight;


    processingCtx.clearRect(
        0,
        0,
        outputWidth,
        outputHeight
    );


    /*
    |--------------------------------------------------------------------------
    | IMPORTANT
    |
    | Disable interpolation
    |--------------------------------------------------------------------------
    */

    processingCtx.imageSmoothingEnabled =
        false;


    processingCtx.drawImage(

        video,

        x,
        y,
        width,
        height,

        0,
        0,
        outputWidth,
        outputHeight

    );


    /*
    |--------------------------------------------------------------------------
    | 1. Original
    |--------------------------------------------------------------------------
    */

    let image =
        processingCtx.getImageData(
            0,
            0,
            outputWidth,
            outputHeight
        );


    let result =
        decodeImage(
            image,
            outputWidth,
            outputHeight
        );


    if (result)
        return result;


    /*
    |--------------------------------------------------------------------------
    | 2. Grayscale
    |--------------------------------------------------------------------------
    */

    image =
        createProcessedImage(
            outputWidth,
            outputHeight,
            "gray"
        );


    result =
        decodeImage(
            image,
            outputWidth,
            outputHeight
        );


    if (result)
        return result;


    /*
    |--------------------------------------------------------------------------
    | 3. Contrast
    |--------------------------------------------------------------------------
    */

    image =
        createProcessedImage(
            outputWidth,
            outputHeight,
            "contrast"
        );


    result =
        decodeImage(
            image,
            outputWidth,
            outputHeight
        );


    if (result)
        return result;


    /*
    |--------------------------------------------------------------------------
    | 4. Threshold
    |--------------------------------------------------------------------------
    */

    image =
        createProcessedImage(
            outputWidth,
            outputHeight,
            "threshold"
        );


    result =
        decodeImage(
            image,
            outputWidth,
            outputHeight
        );


    if (result)
        return result;


    /*
    |--------------------------------------------------------------------------
    | 5. Adaptive-ish threshold
    |--------------------------------------------------------------------------
    */

    image =
        createProcessedImage(
            outputWidth,
            outputHeight,
            "threshold2"
        );


    result =
        decodeImage(
            image,
            outputWidth,
            outputHeight
        );


    if (result)
        return result;


    return null;

}


/*
|--------------------------------------------------------------------------
| Decode Image With jsQR
|--------------------------------------------------------------------------
*/

function decodeImage(
    image,
    width,
    height
) {

    if (
        typeof jsQR !==
        "function"
    ) {

        return null;

    }


    try {

        const result =
            jsQR(

                image.data,

                width,

                height,

                {
                    inversionAttempts:
                        "attemptBoth"

                }

            );


        if (
            result &&
            result.data
        ) {

            return result.data;

        }

    }
    catch (error) {

        console.log(
            "jsQR error:",
            error
        );

    }


    return null;

}


/*
|--------------------------------------------------------------------------
| Image Processing
|--------------------------------------------------------------------------
*/

function createProcessedImage(
    width,
    height,
    mode
) {

    const image =
        processingCtx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        image.data;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        /*
        |--------------------------------------------------------------------------
        | Luminance
        |--------------------------------------------------------------------------
        */

        let gray =
            (
                0.299 * r +
                0.587 * g +
                0.114 * b
            );


        /*
        |--------------------------------------------------------------------------
        | Gray
        |--------------------------------------------------------------------------
        */

        if (
            mode === "gray"
        ) {

            data[i] =
                gray;

            data[i + 1] =
                gray;

            data[i + 2] =
                gray;

        }


        /*
        |--------------------------------------------------------------------------
        | Contrast
        |--------------------------------------------------------------------------
        */

        else if (
            mode === "contrast"
        ) {

            gray =
                (
                    gray - 128
                ) * 1.8 + 128;


            gray =
                Math.max(
                    0,
                    Math.min(
                        255,
                        gray
                    )
                );


            data[i] =
                gray;

            data[i + 1] =
                gray;

            data[i + 2] =
                gray;

        }


        /*
        |--------------------------------------------------------------------------
        | Threshold
        |--------------------------------------------------------------------------
        */

        else if (
            mode === "threshold"
        ) {

            const value =
                gray > 145
                    ? 255
                    : 0;


            data[i] =
                value;

            data[i + 1] =
                value;

            data[i + 2] =
                value;

        }


        /*
        |--------------------------------------------------------------------------
        | Threshold 2
        |--------------------------------------------------------------------------
        */

        else if (
            mode === "threshold2"
        ) {

            const value =
                gray > 175
                    ? 255
                    : 0;


            data[i] =
                value;

            data[i + 1] =
                value;

            data[i + 2] =
                value;

        }

    }


    return image;

}


/*
|--------------------------------------------------------------------------
| Handle QR
|--------------------------------------------------------------------------
*/

function handleQR(
    value
) {

    if (!value)
        return;


    const now =
        Date.now();


    /*
    |--------------------------------------------------------------------------
    | Same QR debounce
    |--------------------------------------------------------------------------
    */

    if (
        value === lastDecodedValue &&
        now - lastDecodedTime < 2500
    ) {

        return;

    }


    lastDecodedValue =
        value;

    lastDecodedTime =
        now;


    /*
    |--------------------------------------------------------------------------
    | Duplicate
    |--------------------------------------------------------------------------
    */

    const exists =
        results.some(
            x =>
                x.qrCode === value
        );


    if (exists) {

        showResult(
            value,
            true
        );

        return;

    }


    /*
    |--------------------------------------------------------------------------
    | Add
    |--------------------------------------------------------------------------
    */

    const item = {

        qrCode: value,

        time: new Date()

    };


    results.push(
        item
    );


    addResult(
        item
    );


    showResult(
        value,
        false
    );


    updateStatus(
        "QR با موفقیت خوانده شد ✓",
        "bg-emerald-100 text-emerald-700"
    );


    /*
    |--------------------------------------------------------------------------
    | Return to scanning
    |--------------------------------------------------------------------------
    */

    setTimeout(
        () => {

            if (scanning) {

                updateStatus(
                    "QR بعدی را قرار دهید",
                    "bg-blue-100 text-blue-700"
                );

            }

        },
        1200
    );

}


/*
|--------------------------------------------------------------------------
| Show Result
|--------------------------------------------------------------------------
*/

function showResult(
    value,
    duplicate
) {

    const box =
        document.getElementById(
            "lastResult"
        );


    const icon =
        document.getElementById(
            "resultIcon"
        );


    const title =
        document.getElementById(
            "resultTitle"
        );


    const qr =
        document.getElementById(
            "lastQr"
        );


    box.classList.remove(
        "hidden"
    );


    box.classList.add(
        "success-animation"
    );


    qr.textContent =
        value;


    if (duplicate) {

        box.className =
            "rounded-3xl p-5 mb-5 border bg-amber-50 border-amber-200";


        icon.className =
            "w-11 h-11 shrink-0 rounded-full flex items-center justify-center text-xl bg-amber-100";


        icon.textContent =
            "⚠️";


        title.className =
            "font-bold text-amber-700";


        title.textContent =
            "این QR قبلاً ثبت شده است";

    }
    else {

        box.className =
            "rounded-3xl p-5 mb-5 border bg-emerald-50 border-emerald-200 success-animation";


        icon.className =
            "w-11 h-11 shrink-0 rounded-full flex items-center justify-center text-xl bg-emerald-100";


        icon.textContent =
            "✓";


        title.className =
            "font-bold text-emerald-700";


        title.textContent =
            "QR با موفقیت شناسایی شد";

    }

}


/*
|--------------------------------------------------------------------------
| Add Result To Table
|--------------------------------------------------------------------------
*/

function addResult(
    item
) {

    const empty =
        document.getElementById(
            "empty"
        );


    if (empty)
        empty.remove();


    const tbody =
        document.getElementById(
            "results"
        );


    const tr =
        document.createElement(
            "tr"
        );


    tr.className =
        "border-b border-slate-100 hover:bg-slate-50";


    const index =
        results.length;


    tr.innerHTML = `

        <td class="px-5 py-4 text-slate-500">
            ${index}
        </td>

        <td class="px-5 py-4">

            <div
                class="font-mono text-xs sm:text-sm break-all text-slate-700">

                ${escapeHtml(item.qrCode)}

            </div>

        </td>

        <td
            class="px-5 py-4 text-xs sm:text-sm text-slate-500 whitespace-nowrap">

            ${formatDate(item.time)}

        </td>

    `;


    tbody.prepend(
        tr
    );


    document
        .getElementById("count")
        .textContent =
        results.length;


    document
        .getElementById("exportBtn")
        .disabled = false;

}


/*
|--------------------------------------------------------------------------
| Stop Camera
|--------------------------------------------------------------------------
*/

function stopCamera() {

    scanning = false;


    if (scanTimeout) {

        clearTimeout(
            scanTimeout
        );

        scanTimeout = null;

    }


    if (stream) {

        stream
            .getTracks()
            .forEach(
                t => t.stop()
            );

        stream = null;

    }


    track = null;


    video.srcObject =
        null;


    document
        .getElementById("cameraOff")
        .classList.remove(
            "hidden"
        );


    document
        .getElementById("scannerOverlay")
        .classList.add(
            "hidden"
        );


    document
        .getElementById("zoomContainer")
        .classList.add(
            "hidden"
        );


    document
        .getElementById("startBtn")
        .disabled = false;


    document
        .getElementById("stopBtn")
        .disabled = true;


    updateStatus(
        "اسکن متوقف شد",
        "bg-slate-100 text-slate-600"
    );

}


/*
|--------------------------------------------------------------------------
| Clear Results
|--------------------------------------------------------------------------
*/

function clearResults() {

    if (
        results.length === 0
    )
        return;


    if (
        !confirm(
            "آیا تمام QR های اسکن شده پاک شوند؟"
        )
    )
        return;


    results = [];


    lastDecodedValue =
        "";

    lastDecodedTime =
        0;


    document
        .getElementById("results")
        .innerHTML = `

        <tr id="empty">

            <td
                colspan="3"
                class="text-center py-12 text-slate-400">

                هنوز QR ای اسکن نشده است

            </td>

        </tr>

    `;


    document
        .getElementById("count")
        .textContent =
        "0";


    document
        .getElementById("exportBtn")
        .disabled =
        true;

}


/*
|--------------------------------------------------------------------------
| Excel
|--------------------------------------------------------------------------
*/

function exportExcel() {

    if (
        results.length === 0
    ) {

        alert(
            "هیچ اطلاعاتی برای خروجی وجود ندارد."
        );

        return;

    }


    const data =
        results.map(
            (item, index) => ({

                "ردیف":
                    index + 1,

                "QR Code":
                    item.qrCode,

                "زمان اسکن":
                    formatDate(
                        item.time
                    )

            })
        );


    const worksheet =
        XLSX.utils.json_to_sheet(
            data
        );


    worksheet["!cols"] = [

        {
            wch: 8
        },

        {
            wch: 70
        },

        {
            wch: 25
        }

    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "QR دسته چک"
    );


    const date =
        new Date();


    const filename =
        "Cheque_QR_" +
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2, "0") +
        ".xlsx";


    XLSX.writeFile(
        workbook,
        filename
    );

}


/*
|--------------------------------------------------------------------------
| Status
|--------------------------------------------------------------------------
*/

function updateStatus(
    text,
    classes
) {

    const element =
        document.getElementById(
            "status"
        );


    element.textContent =
        text;


    element.className =
        "shrink-0 px-4 py-2 rounded-full text-xs sm:text-sm " +
        classes;

}


/*
|--------------------------------------------------------------------------
| Date
|--------------------------------------------------------------------------
*/

function formatDate(
    date
) {

    return date.toLocaleString(
        "fa-IR",
        {

            year: "numeric",

            month: "2-digit",

            day: "2-digit",

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit"

        }
    );

}


/*
|--------------------------------------------------------------------------
| Escape HTML
|--------------------------------------------------------------------------
*/

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/*
|--------------------------------------------------------------------------
| Cleanup
|--------------------------------------------------------------------------
*/

window.addEventListener(
    "beforeunload",
    () => {

        stopCamera();

    }
);

</script>
